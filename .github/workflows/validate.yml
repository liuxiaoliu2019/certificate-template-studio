name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run quick validation
        run: python scripts/quick_validate.py
      - name: Run public-release validation
        run: python scripts/public_release_validate.py
      - name: Test Unix installer
        if: runner.os == 'Linux'
        run: bash install.sh --destination "$RUNNER_TEMP/certificate-template-studio"
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Destination "$env:RUNNER_TEMP/certificate-template-studio"
      - name: Build release archive
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python scripts/build_release.py
